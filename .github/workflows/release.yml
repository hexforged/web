name: 🚀 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 📦 Package & publish
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: 📝 Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: 🗃️ Package the deployable site
        run: |
          mkdir -p dist/hexforged-web
          cp -r public src templates aurora composer.json dist/hexforged-web/
          tar -C dist -czf "hexforged-web-${{ github.ref_name }}.tar.gz" hexforged-web
          sha256sum "hexforged-web-${{ github.ref_name }}.tar.gz" > "hexforged-web-${{ github.ref_name }}.tar.gz.sha256"

      - name: 🚀 Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Hexforged Web ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            "hexforged-web-${{ github.ref_name }}.tar.gz" \
            "hexforged-web-${{ github.ref_name }}.tar.gz.sha256"
