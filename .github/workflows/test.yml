name: 🧪 Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  pest:
    name: ⚗️ Pest (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: 📦 Install dependencies
        run: composer install --no-interaction --no-progress

      - name: 🧪 Run Pest
        run: ./vendor/bin/pest --no-coverage

  javascript:
    name: 🟨 JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🟢 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 🔍 Syntax-check site modules
        run: |
          for f in public/cdn/js/*.js; do
            node --input-type=module --check < "$f" && echo "OK: $f"
          done

  commitlint:
    name: 📝 Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Lint pull request commits
        run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

  gitleaks:
    name: 🔒 Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔍 Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: 'false'
