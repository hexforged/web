name: 🧪 Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, 'feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  pest:
    name: ⚗️ Pest (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: 📦 Install dependencies
        run: composer install --no-interaction --no-progress

      - name: 🧪 Run Pest
        run: ./vendor/bin/pest --no-coverage

  javascript:
    name: 🟨 JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6

      - name: 🟢 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 🔍 Syntax-check site modules
        run: |
          for f in public/cdn/js/*.js; do
            node --input-type=module --check < "$f" && echo "OK: $f"
          done

  commitlint:
    name: 📝 Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Lint pull request commits
        run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

  gitleaks:
    name: 🔒 Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The managed gitleaks-action requires a paid org license; the OSS
      # binary (MIT) does not. Pinned by version + sha256.
      - name: 📦 Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: 🔍 Scan for secrets
        run: gitleaks git --no-color --redact .
