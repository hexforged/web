name: 🔀 Back-merge

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  back-merge:
    name: ↩️ main → develop
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔀 Open or update the back-merge PR
        env:
          # Org policy blocks GITHUB_TOKEN from creating PRs; use the
          # kyaulabs-bot PAT (repo secret) for pull request operations.
          GH_TOKEN: ${{ secrets.KYAULABS_BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin develop
          branch="back-merge/main-to-develop"
          git checkout -B "$branch" origin/develop
          git merge --no-edit origin/main || {
            echo "::warning::Merge conflicts — aborting; resolve manually."
            git merge --abort
            exit 0
          }
          git push --force-with-lease origin "$branch"

          if ! gh pr view "$branch" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh pr create \
              --repo "${{ github.repository }}" \
              --base develop \
              --head "$branch" \
              --title "🔀 Back-merge main into develop" \
              --body "Automated back-merge of \`main\` into \`develop\` after release ${GITHUB_SHA}."
          fi
          gh pr merge "$branch" --repo "${{ github.repository }}" --auto --merge || true
